name: Build Two Phone Phrase Remote

on:
  push:
    branches:
      - build/two-phone-phrase-remote-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: two-phone-phrase-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk TwoPhonePhraseRemote-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TwoPhonePhraseRemote-v1
          path: two-phone-phrase-remote/TwoPhonePhraseRemote-v1.apk
